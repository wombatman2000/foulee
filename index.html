<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foulée</title>
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foulée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sticky top bar, one scrolling column (max 640px), fixed bottom tab bar; sheets slide up for every form. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E2E7EC; --ink:#13202B; --muted:#5A6875; --line:#D3DAE1;
  --accent:#C63A23; --accent-soft:#F6E0DA; --on-accent:#FFFFFF;
  --z-recup:#8796A6; --z-ef:#21907A; --z-seuil:#C48610; --z-as:#D9612A; --z-vma:#C02639;
  --ok:#1B7A58; --ok-soft:#DCEFE6; --warn:#A85A08; --warn-soft:#F6E8D4;
  --shadow:0 1px 2px rgba(19,32,43,.06),0 6px 18px rgba(19,32,43,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17202A; --sunk:#202B36; --ink:#E6ECF1; --muted:#93A2B0; --line:#2A3642;
  --accent:#F06A4E; --accent-soft:#3A221D; --on-accent:#1A0E0B;
  --z-recup:#7E90A2; --z-ef:#3BBF98; --z-seuil:#E6B03A; --z-as:#F0864A; --z-vma:#EC5664;
  --ok:#4FCB97; --ok-soft:#173329; --warn:#F0A64E; --warn-soft:#3A2A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17202A; --sunk:#202B36; --ink:#E6ECF1; --muted:#93A2B0; --line:#2A3642;
  --accent:#F06A4E; --accent-soft:#3A221D; --on-accent:#1A0E0B;
  --z-recup:#7E90A2; --z-ef:#3BBF98; --z-seuil:#E6B03A; --z-as:#F0864A; --z-vma:#EC5664;
  --ok:#4FCB97; --ok-soft:#173329; --warn:#F0A64E; --warn-soft:#3A2A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
.iconbtn{appearance:none;border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.iconbtn:hover{color:var(--ink)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.mark{font:700 26px/1 var(--f-display);letter-spacing:.01em;display:flex;align-items:baseline;gap:6px}
.mark b{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);transform:skewX(-14deg)}
.countdown{font:600 15px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.countdown strong{color:var(--accent);font-weight:700}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.col{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{appearance:none;border:0;background:none;padding:6px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);cursor:pointer;font:600 13px/1.1 var(--f-body)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* type */
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:26px;line-height:1.05}
h3{font-size:20px;line-height:1.1}
.eyebrow{font:600 12.5px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:0}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:600 15px/1.1 var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hero .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.hero .notation{font:600 30px/1.05 var(--f-display);letter-spacing:.005em;overflow-wrap:anywhere}
.hero .meta{font:500 15px/1.2 var(--f-body);color:color-mix(in srgb,var(--bg) 78%,transparent)}
.hero .strip{background:color-mix(in srgb,var(--bg) 10%,transparent)}
.hero .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}

.goal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.goal .big{font:700 34px/1 var(--f-display)}
.goal .j{font:700 34px/1 var(--f-display);color:var(--accent);text-align:right}
.goal .sub{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14.5px}

/* intensity strip */
.strip{display:flex;align-items:flex-end;gap:1px;height:46px;border-radius:6px;padding:4px;background:var(--sunk);overflow:hidden}
.strip i{display:block;min-width:2px;border-radius:2px 2px 0 0}
.strip.sm{height:26px;padding:2px;border-radius:4px}

/* week list */
.week{display:flex;flex-direction:column;gap:8px}
.week-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-inline:2px}
.week-h h3 span{color:var(--muted);font-weight:600}
.week-tools{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.sess{appearance:none;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 0;display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;cursor:pointer;position:relative;overflow:hidden}
.sess:hover{border-color:var(--muted)}
.sess::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--zc,var(--z-ef))}
.sess.today{border-color:var(--ink);box-shadow:var(--shadow)}
.sess .d{display:flex;flex-direction:column;align-items:center;line-height:1}
.sess .d small{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sess .d strong{font:700 26px/1.05 var(--f-display)}
.sess .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.sess .t b{font:600 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--zc,var(--z-ef))}
.sess .t span{font:600 18px/1.15 var(--f-display);overflow-wrap:anywhere}
.sess .s{text-align:right;font-size:14px;color:var(--muted);white-space:nowrap}
.sess.done .t span{color:var(--muted)}
.sess.missed .t span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.sess.example{cursor:default;opacity:.92}

.pill{display:inline-flex;align-items:center;gap:5px;font:600 12.5px/1 var(--f-body);padding:5px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.z{background:color-mix(in srgb,var(--zc) 16%,transparent);color:var(--zc)}

details.past summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 2px;list-style:none}
details.past summary::-webkit-details-marker{display:none}
details.past summary::before{content:"▸ ";}
details.past[open] summary::before{content:"▾ ";}
details.past > .col{margin-top:10px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font:700 28px/1 var(--f-display)}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:600}
.kpi .l{font-size:13px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font:500 10.5px var(--f-body)}
.chart .done{fill:var(--ink)}
.chart .done.cur{fill:var(--accent)}
.chart .plan{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 2}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* run list */
.run{appearance:none;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.run:hover{border-color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.metrics div{display:flex;flex-direction:column;gap:2px;min-width:0}
.metrics b{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.metrics span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* routes */
.route{display:flex;flex-direction:column;gap:8px}
.links{display:flex;flex-direction:column;gap:8px}
.link-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.link-row:first-child{border-top:0;padding-top:0}

/* empty state */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;background:transparent}
.note{border-radius:10px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:14.5px}
.note.info{background:var(--sunk);color:var(--muted)}

/* sheet */
dialog#sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
dialog#sheet::backdrop{background:rgba(10,16,22,.45)}
@media (min-width:700px){dialog#sheet{margin:auto;border-radius:18px}}
.sheet-in{display:flex;flex-direction:column;gap:16px;padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);padding-block:4px;z-index:1}
.sheet-head::before{content:"";position:absolute;top:-8px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}

/* forms */
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font:600 14px/1.2 var(--f-body);color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px}
.field textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.combo{display:grid;grid-template-columns:1fr 92px;gap:6px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font:600 14px var(--f-body);color:var(--muted);padding:0 4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days label{position:relative}
.days input{position:absolute;opacity:0;inset:0}
.days span{display:flex;align-items:center;justify-content:center;height:44px;border-radius:10px;border:1px solid var(--line);font:700 17px var(--f-display);cursor:pointer;background:var(--bg)}
.days input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
input[type=range]{accent-color:var(--accent);padding:0;min-height:30px}
.err{color:var(--accent);font-weight:600;font-size:14.5px}
.preview{background:var(--bg);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}

/* step list */
.steps{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:10px 12px 10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step i{align-self:stretch;background:var(--zc)}
.step .what{display:flex;flex-direction:column;gap:2px;min-width:0}
.step .what b{font:600 17px/1.15 var(--f-display)}
.step .what small{color:var(--muted);font-size:13.5px}
.step .pace{text-align:right;font:600 16px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.step .pace small{display:block;color:var(--muted);font:500 12px var(--f-body)}
.rep-h{padding:8px 12px;background:var(--sunk);font:600 14px var(--f-body);color:var(--muted);border-top:1px solid var(--line)}
.rep-h:first-child{border-top:0}
.rep-in .step{padding-left:0;margin-left:14px}
.ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:15px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:380px){ .metrics{grid-template-columns:repeat(2,1fr)} .kpi .v{font-size:24px} }
@media (prefers-reduced-motion:no-preference){ .sess,.run,.btn{transition:border-color .15s,filter .15s} }
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="mark"><b aria-hidden="true"></b>Foulée</div><div class="row" style="gap:4px"><div class="countdown num" id="countdown"></div><button class="iconbtn" id="settings" aria-label="Sauvegarde et réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div></div></header>
<main id="view"><div class="col"><div class="empty"><p class="muted">Chargement de ton carnet…</p></div></div></main>
<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" data-tab="plan" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
  <button class="tab" data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l2.5-6 4 11 2.5-5H21"/></svg>Journal</button>
  <button class="tab" data-tab="routes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h6.5a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7H16"/></svg>Parcours</button>
</div></nav>
<dialog id="sheet" aria-label="Détail"></dialog>
<div id="toast" role="status" hidden></div>

<script id="core">
const FOULEE = (() => {
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
  const mondayOf = s => { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
  const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);

  const GOALS = {
    '5k': { label: '5 km', km: 5, sl: 50 },
    '10k': { label: '10 km', km: 10, sl: 60 },
    'semi': { label: 'Semi-marathon', km: 21.0975, sl: 80 },
    'marathon': { label: 'Marathon', km: 42.195, sl: 110 },
  };
  const ZPCT = { recup: [.55, .62], ef: [.62, .70], seuil: [.84, .88], vma: [.98, 1.03] };
  const AS = { '5k': [.93, .97], '10k': [.88, .92], semi: [.82, .86], marathon: [.76, .80] };
  const AS_LABEL = { '5k': 'AS5', '10k': 'AS10', semi: 'AS21', marathon: 'AS42' };
  const ZNAME = { recup: 'Récup', ef: 'EF', seuil: 'Seuil', vma: 'VMA' };
  const zoneLabel = (z, goal) => z === 'as' ? (AS_LABEL[goal] || 'AS') : ZNAME[z];
  const paceRange = (z, c) => { const p = z === 'as' ? (AS[c.goal] || AS['10k']) : ZPCT[z]; const v = c.vma || 14; return [3600 / (v * p[1]), 3600 / (v * p[0])]; };
  const paceMid = (z, c) => { const r = paceRange(z, c); return (r[0] + r[1]) / 2; };

  function stepTD(st, c) {
    if (st.k === 'rep') { let t = 0, d = 0; for (const x of st.steps) { const r = stepTD(x, c); t += r.t; d += r.d; } return { t: t * st.n, d: d * st.n }; }
    const p = paceMid(st.z, c);

<script>

  const note = (S.note ? `<div class="note">${esc(S.note)}</div>` : '') + (stale ? `<button class="note info" style="border:0;text-align:left;cursor:pointer" data-act="backup">Pense à sauvegarder tes données : dernière sauvegarde ${S.lastBackup ? 'le ' + esc(fmtDay(S.lastBackup, { day: 'numeric', month: 'long' })) : 'jamais faite'}. Toucher pour sauvegarder.</button>` : '');
  v.innerHTML = `<div class="col">${note}${S.tab === 'plan' ? viewPlan() : S.tab === 'journal' ? viewJournal() : viewRoutes()}</div>`;
  bindView(v);
}

function sessRow(w, opts = {}) {
  const z = F.mainZone(w);
  const done = isDone(w), missed = !done && w.date < TODAY;
  const e = est(w);
  const status = done ? `<span class="pill ok">Faite</span>` : missed ? `<span class="pill">Non faite</span>` : `<span class="num">${F.fmtKm(e.km)} km</span>`;
  const d = F.parseD(w.date);
  return `<button class="sess ${w.date === TODAY ? 'today' : ''} ${done ? 'done' : ''} ${missed ? 'missed' : ''} ${opts.example ? 'example' : ''}" ${opts.example ? 'tabindex="-1" aria-disabled="true"' : `data-open="${w.id}"`} style="--zc:${zc(z)}">
    <span class="d"><small>${fmtDay(w.date, { weekday: 'short' }).replace('.', '')}</small><strong class="num">${d.getDate()}</strong></span>
    <span class="t"><b>${esc(TYPES[w.type]?.short || '')}${w.date === TODAY ? ' · aujourd’hui' : ''}</b><span>${esc(F.notation(w, ctx()))}</span></span>
    <span class="s">${status}</span></button>`;
}

function viewPlan() {
  const ws = workouts();
  if (!S.profile || !ws.length) {
    const ex = F.genPlan({ goal: '10k', raceDate: defaultRace(), vma: 14, days: [1, 3, 6] }, TODAY);
    const exWeek = ex.workouts ? ex.workouts.filter(w => w.date >= F.addDays(ex.firstMon, 7) && w.date < F.addDays(ex.firstMon, 14)) : [];
    const save = S.profile ? '' : '';
    return `<section class="empty">

  }
  const p = S.profile, g = F.GOALS[p.goal];

  let html = `<section class="card goal">
      <div><p class="eyebrow">Objectif</p><div class="big">${esc(g?.label || '')}</div></div>
      <div class="j num">${j !== null ? `J-${j}` : 'Terminé'}</div>
      <div class="sub"><span>${esc(fmtDay(p.raceDate, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}</span><span class="num">VMA ${F.fmtKm(Number(p.vma))} km/h</span><span class="num">${esc(F.zoneLabel('as', p.goal))} ${F.fmtPace(F.paceMid('as', ctx()))}/km</span></div>
      <div class="sub"><button class="btn ghost" data-act="setup" style="padding-left:0">Modifier l’objectif</button></div>
    </section>`;
  if (next) {
    const e = est(next);
    html += `<section class="hero">
        <p class="eyebrow">Prochaine séance · ${esc(relDay(next.date))}</p>
        <div class="notation">${esc(F.notation(next, ctx()))}</div>
        ${strip(next)}
        <div class="spread"><span class="meta num">${esc(TYPES[next.type]?.label || '')} · ${e.label}</span><button class="btn" data-open="${next.id}">Voir la séance</button></div>
      </section>`;
  }
  const curMon = F.mondayOf(TODAY);
  const byWeek = new Map();
  ws.forEach(w => { const m = F.mondayOf(w.date); if (!byWeek.has(m)) byWeek.set(m, []); byWeek.get(m).push(w); });
  const firstMon = S.plan.firstMon || [...byWeek.keys()][0];
  const weekBlock = (mon, list) => {
    const n = Math.round(F.daysBetween(firstMon, mon) / 7) + 1;
    const km = list.reduce((a, w) => a + est(w).km, 0);
    const exportable = list.filter(w => w.date >= TODAY && !isDone(w));
    return `<section class="week">
      <div class="week-h"><h3>${n > 0 ? `S${n} ` : ''}<span>· ${esc(fmtDay(mon, { day: 'numeric', month: 'short' }))} – ${esc(fmtDay(F.addDays(mon, 6), { day: 'numeric', month: 'short' }))}</span></h3>
      <div class="week-tools"><span class="num">≈ ${F.fmtKm(km, 0)} km</span>${exportable.length > 1 ? `<button class="btn ghost" data-export-week="${mon}">Export Garmin</button>` : ''}</div></div>
      ${list.map(w => sessRow(w)).join('')}</section>`;
  };
  const past = [], future = [];
  [...byWeek.entries()].forEach(([m, l]) => (m < curMon ? past : future).push([m, l]));
  html += future.map(([m, l]) => weekBlock(m, l)).join('');
  html += `<div class="row"><button class="btn" data-act="add-w">+ Ajouter une séance</button></div>`;
  if (past.length) html += `<details class="past"><summary>Semaines passées (${past.length})</summary><div class="col">${past.reverse().map(([m, l]) => weekBlock(m, l)).join('')}</div></details>`;
  return html;
}

function weekStats(mon) {
  const sun = F.addDays(mon, 6);
  const ws = workouts().filter(w => w.date >= mon && w.date <= sun);
  const rs = S.runs.filter(r => r.date >= mon && r.date <= sun);
  return {
    plannedKm: ws.reduce((a, w) => a + est(w).km, 0), nW: ws.length, doneW: ws.filter(isDone).length,
    doneKm: rs.reduce((a, r) => a + (Number(r.dist) || 0), 0), time: rs.reduce((a, r) => a + (Number(r.dur) || 0), 0), nR: rs.length,
  };
}
function chart() {
  const cur = F.mondayOf(TODAY);
  const mons = Array.from({ length: 8 }, (_, i) => F.addDays(cur, (i - 6) * 7));
  const st = mons.map(weekStats);
  const maxV = Math.max(10, ...st.map(s => Math.max(s.doneKm, s.plannedKm)));
  const top = Math.ceil(maxV / 10) * 10;
  const W = 340, H = 160, L = 28, B = 22, T = 8, R = 4;
  const bw = (W - L - R) / mons.length;
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  [0, top / 2, top].forEach(v => { g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`; });
  mons.forEach((m, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64, s = st[i];
    if (s.plannedKm > 0) g += `<rect class="plan" x="${x}" y="${y(s.plannedKm)}" width="${w}" height="${y(0) - y(s.plannedKm)}" rx="2"/>`;
    if (s.doneKm > 0) g += `<rect class="done ${m === cur ? 'cur' : ''}" x="${x + 3}" y="${y(s.doneKm)}" width="${w - 6}" height="${y(0) - y(s.doneKm)}" rx="2"/>`;
    const d = F.parseD(m);
    g += `<text class="lbl" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${m === cur ? 'cette sem.' : `${d.getDate()}/${d.getMonth() + 1}`}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilomètres réalisés et prévus sur les 8 dernières semaines">${g}</svg>`;
}
function judge(run) {
  const w = (S.plan?.workouts || []).find(x => x.id === run.wid);
  const out = [];
  if (!w || !run.dist) return out;
  const e = est(w);
  const ratio = run.dist / e.km;
  out.push(ratio < 0.85 ? `<span class="pill warn">Écourtée (${Math.round(ratio * 100)} %)</span>` : ratio > 1.15 ? `<span class="pill">Plus longue que prévu</span>` : `<span class="pill ok">Volume conforme</span>`);
  if (!w.steps.some(s => s.k === 'rep') && run.dur) {
    const [fast, slow] = F.paceRange(F.mainZone(w), ctx());
    const p = run.dur / run.dist;
    out.push(p < fast - 5 ? `<span class="pill warn">Trop rapide pour ${esc(F.zoneLabel(F.mainZone(w), ctx().goal))}</span>` : p > slow + 5 ? `<span class="pill">Plus lent que la cible</span>` : `<span class="pill ok">Allure dans la cible</span>`);
  }
  return out;
}
function viewJournal() {
  const s = weekStats(F.mondayOf(TODAY));
  const pct = s.plannedKm ? Math.min(100, Math.round(s.doneKm / s.plannedKm * 100)) : 0;
  const runs = S.runs.slice().sort((a, b) => b.date.localeCompare(a.date));
  let html = `<section class="col" style="gap:10px"><p class="eyebrow">Cette semaine</p>
    <div class="kpis">
      <div class="kpi"><span class="v num">${F.fmtKm(s.doneKm)}<small> / ${F.fmtKm(s.plannedKm, 0)} km</small></span><div class="bar"><i style="width:${pct}%"></i></div><span class="l">Distance</span></div>
      <div class="kpi"><span class="v num">${s.doneW}<small> / ${s.nW}</small></span><span class="l">Séances du plan faites</span></div>
      <div class="kpi"><span class="v num">${s.time ? F.fmtDurRound(s.time) : '0\''}</span><span class="l">Temps de course</span></div>
    </div></section>
    <section class="card col" style="gap:10px"><div class="spread"><h3>Volume hebdomadaire</h3><div class="legend"><span><i style="background:var(--ink)"></i>Réalisé</span><span><i style="border:1.2px dashed var(--muted)"></i>Prévu</span></div></div>${chart()}</section>
    <div class="row"><button class="btn primary" data-act="add-run">+ Ajouter une sortie</button></div>`;
  if (!runs.length) {
    html += `<section class="empty"><h3>Aucune sortie pour l’instant</h3><p class="muted">Après chaque course, ajoute ta sortie à la main ou importe le fichier GPX/TCX exporté depuis Garmin Connect (activité → roue dentée → Exporter). Foulée la compare à la séance prévue : volume, allure, ressenti.</p></section>`;
    return html;
  }
  html += `<section class="col" style="gap:10px"><p class="eyebrow">Sorties (${runs.length})</p>` + runs.map(r => {
    const w = (S.plan?.workouts || []).find(x => x.id === r.wid);
    const pace = r.dist && r.dur ? F.fmtPace(r.dur / r.dist) : '–';
    return `<button class="run" data-run="${r.id}">
      <div class="spread"><b>${esc(fmtDay(r.date, { weekday: 'long', day: 'numeric', month: 'long' }))}</b>${r.rpe ? `<span class="pill">Ressenti ${esc(r.rpe)}/10</span>` : ''}</div>
      ${w ? `<span class="muted small">Prévu : ${esc(F.notation(w, ctx()))}</span>` : `<span class="muted small">Sortie libre</span>`}
      <div class="metrics"><div><b>${r.dist ? F.fmtKm(Number(r.dist), 2) : '–'}</b><span>km</span></div><div><b>${r.dur ? hms(r.dur) : '–'}</b><span>durée</span></div><div><b>${pace}</b><span>/km</span></div><div><b>${r.hr || '–'}</b><span>FC moy</span></div></div>
      ${(() => { const j = judge(r); return j.length ? `<div class="row" style="gap:6px">${j.join('')}</div>` : ''; })()}
      ${r.notes ? `<p class="small muted">${esc(r.notes)}</p>` : ''}
    </button>`;
  }).join('') + `</section>`;
  return html;
}
const SURF = { route: 'Route', chemin: 'Chemin', piste: 'Piste', mixte: 'Mixte' };
function viewRoutes() {
  const rs = S.routes.slice().sort((a, b) => (Number(a.km) || 0) - (Number(b.km) || 0));
  let html = `<section class="col" style="gap:10px"><div class="spread"><h2>Mes parcours</h2><button class="btn primary" data-act="add-route">+ Ajouter</button></div>
    <p class="muted small">Enregistre tes boucles habituelles avec leur distance et leur dénivelé. Chaque séance te propose ensuite celles qui collent à sa distance, en privilégiant le plat pour le fractionné.</p></section>`;
  html += rs.length ? rs.map(r => `<button class="run" data-route="${r.id}">
      <div class="spread"><b style="font:600 20px/1.1 var(--f-display)">${esc(r.name)}</b><span class="pill">${esc(SURF[r.surface] || '')}</span></div>
      <div class="metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><b>${F.fmtKm(Number(r.km), 1)}</b><span>km</span></div><div><b>${r.dplus || 0}</b><span>m D+</span></div><div><b style="font-size:16px">${r.kind === 'ar' ? 'Aller-retour' : 'Boucle'}</b><span>forme</span></div></div>
      ${r.notes ? `<p class="small muted">${esc(r.notes)}</p>` : ''}</button>`).join('')
    : `<section class="empty"><h3>Aucun parcours enregistré</h3><p class="muted">Ajoute ta boucle du quotidien, ton parcours de sortie longue et une portion plate pour le fractionné.</p></section>`;
  html += `<section class="card"><h3 style="margin-bottom:10px">Trouver un nouveau parcours</h3>${finderLinks()}</section>`;
  return html;
}
function finderLinks(km) {
  const k = km ? ` de ${F.fmtKm(km)} km` : '';
  return `<div class="links">
    <div class="link-row"><div><b>Trailrouter</b><p class="small muted">Génère une boucle${k} depuis ton point de départ, en favorisant chemins et espaces verts.</p></div><a class="btn" href="https://trailrouter.com/" target="_blank" rel="noopener">Ouvrir</a></div>
    <div class="link-row"><div><b>Garmin Connect · Parcours</b><p class="small muted">Crée un parcours aller-retour${k} basé sur les tracés les plus courus et synchronise-le avec ton compte.</p></div><a class="btn" href="https://connect.garmin.com/modern/courses" target="_blank" rel="noopener">Ouvrir</a></div>
    <div class="link-row"><div><b>Openrunner</b><p class="small muted">Trace à la main sur carte IGN, avec profil de dénivelé.</p></div><a class="btn" href="https://www.openrunner.com/" target="_blank" rel="noopener">Ouvrir</a></div>
  </div>`;
}
function matchRoutes(w) {
  const d = est(w).km;
  const z = F.mainZone(w);
  const quality = ['vma', 'seuil', 'as'].includes(z) && w.type !== 'sl';
  return S.routes.map(r => {
    const km = Number(r.km) || 0; const dev = (km - d) / d;
    const flat = (Number(r.dplus) || 0) / Math.max(km, 1) < 10;
    let score = Math.abs(dev);
    if (quality) { if (!flat) score += .2; if (r.surface === 'piste') score -= .1; if (r.surface === 'chemin') score += .1; }
    if (w.type === 'sl' && r.surface === 'chemin') score -= .05;
    return { r, dev, flat, score };
  }).filter(x => Math.abs(x.dev) <= 0.2).sort((a, b) => a.score - b.score).slice(0, 3);
}

function bindView(v) {
  $$('[data-open]', v).forEach(b => b.onclick = () => sheetWorkout(b.dataset.open));
  $$('[data-run]', v).forEach(b => b.onclick = () => sheetRun(S.runs.find(r => r.id === b.dataset.run)));
  $$('[data-route]', v).forEach(b => b.onclick = () => sheetRoute(S.routes.find(r => r.id === b.dataset.route)));
  $$('[data-export-week]', v).forEach(b => b.onclick = () => {
    const mon = b.dataset.exportWeek, sun = F.addDays(mon, 6);
    exportGarmin(workouts().filter(w => w.date >= mon && w.date <= sun && w.date >= TODAY && !isDone(w)), `semaine-${mon}`);
  });
  $$('[data-act]', v).forEach(b => b.onclick = () => ({ setup: sheetSetup, 'add-w': () => sheetEdit(null), 'add-run': () => sheetRun(null), 'add-route': () => sheetRoute(null), backup: sheetSettings })[b.dataset.act]());
}
$$('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });

/* ---------- sheets ---------- */
function defaultRace() { let d = F.addDays(TODAY, 70); while (F.parseD(d).getDay() !== 0) d = F.addDays(d, 1); return d; }
const DAYLBL = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const DAYNAME = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
function sheetSetup() {
  const p = S.profile || { goal: '10k', raceDate: defaultRace(), vma: 14, days: [1, 3, 6] };
  const body = `<form id="setup">
    <div class="grid2">
      <label class="field"><span>Objectif</span><select id="su-goal">${Object.entries(F.GOALS).map(([k, g]) => `<option value="${k}" ${k === p.goal ? 'selected' : ''}>${g.label}</option>`).join('')}</select></label>
      <label class="field"><span>Date de la course</span><input id="su-date" type="date" value="${esc(p.raceDate)}" min="${F.addDays(TODAY, 2)}" required></label>
    </div>
    <label class="field"><span>VMA (km/h)</span><input id="su-vma" type="number" inputmode="decimal" step="0.1" min="8" max="25" value="${esc(p.vma)}" required></label>
    <details><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:600">Je ne connais pas ma VMA</summary>
      <div class="col" style="gap:10px;margin-top:10px"><p class="small muted">Estimation à partir d’un chrono récent couru à fond.</p>
      <div class="grid3"><label class="field"><span>Distance</span><select id="su-ed"><option value="5">5 km</option><option value="10" selected>10 km</option><option value="21.0975">Semi</option></select></label>
      <label class="field"><span>Chrono</span><input id="su-et" placeholder="48:30" inputmode="numeric"></label>
      <div class="field"><span>&nbsp;</span><button type="button" class="btn" id="su-calc">Calculer</button></div></div></div></details>
    <fieldset><legend>Jours d’entraînement</legend><div class="days">${DAYLBL.map((l, i) => `<label title="${DAYNAME[i]}"><input type="checkbox" value="${i}" ${(p.days || []).map(Number).includes(i) ? 'checked' : ''} aria-label="${DAYNAME[i]}"><span>${l}</span></label>`).join('')}</div>
      <p class="small muted">Le dernier jour coché accueille la sortie longue, le premier la séance de qualité.</p></fieldset>
    <div class="preview" id="su-prev"></div>
    <p class="err" id="su-err" hidden></p>
    ${S.plan?.workouts?.length ? `<p class="small muted">Les séances futures générées automatiquement seront remplacées. Tes séances ajoutées à la main et celles déjà faites sont conservées.</p>` : ''}
    <button class="btn primary block" type="submit">Enregistrer ce plan</button>
  </form>`;
  openSheet(S.profile ? 'Modifier l’objectif' : 'Créer mon plan', body, el => {
    const read = () => ({ goal: $('#su-goal', el).value, raceDate: $('#su-date', el).value, vma: num($('#su-vma', el).value), days: $$('.days input:checked', el).map(i => Number(i.value)) });
    let last = null;
    const prev = () => {
      const q = read(); const r = F.genPlan(q, TODAY); last = r;
      const box = $('#su-prev', el);
      if (r.error || !(q.vma >= 8 && q.vma <= 25)) { box.innerHTML = `<p class="err">${esc(r.error || 'Indique une VMA entre 8 et 25 km/h.')}</p>`; return; }
      const c = { vma: q.vma, goal: q.goal };
      const km = r.workouts.reduce((a, w) => a + F.wTD(w, c).d / 1000, 0);
      const firstQ = r.workouts.find(w => w.type === 'frac');
      box.innerHTML = `<div class="spread"><b class="num">${r.weeks} semaines · ${r.workouts.length} séances</b><span class="small muted num">≈ ${F.fmtKm(km / r.weeks, 0)} km/sem.</span></div>
        <div class="small muted num">EF ${F.fmtPace(F.paceRange('ef', c)[0])}–${F.fmtPace(F.paceRange('ef', c)[1])} · Seuil ${F.fmtPace(F.paceRange('seuil', c)[0])}–${F.fmtPace(F.paceRange('seuil', c)[1])} · ${F.zoneLabel('as', q.goal)} ${F.fmtPace(F.paceMid('as', c))} · VMA ${F.fmtPace(F.paceRange('vma', c)[0])} /km</div>
        ${firstQ ? `<div class="small">Première séance de qualité : <b>${esc(F.notation(firstQ, c))}</b></div>` : ''}`;
    };
    el.querySelector('form').addEventListener('input', prev);
    prev();
    $('#su-calc', el).onclick = () => {
      const d = Number($('#su-ed', el).value), t = parseDur($('#su-et', el).value.includes(':') ? $('#su-et', el).value : $('#su-et', el).value + ':00');
      if (!t) { toast('Saisis un chrono au format mm:ss ou h:mm:ss.'); return; }
      const pct = d <= 5 ? 0.95 : d <= 10 ? 0.90 : 0.85;
      $('#su-vma', el).value = (d / (t / 3600) / pct).toFixed(1); prev();
    };
    el.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const q = read(); prev();
      const err = $('#su-err', el);
      if (!last || last.error || !(q.vma >= 8 && q.vma <= 25)) { err.hidden = false; err.textContent = last?.error || 'Vérifie la VMA (entre 8 et 25 km/h).'; return; }
      const keep = (S.plan?.workouts || []).filter(w => !w.auto || w.date < TODAY || isDone(w));
      const btn = e.submitter || $('button[type=submit]', el); btn.disabled = true; btn.textContent = 'Enregistrement…';
      const ok1 = await Store.saveProfile({ ...q, updated: new Date().toISOString() });
      const ok2 = ok1 && await Store.savePlan({ firstMon: last.firstMon, weeks: last.weeks, workouts: keep.concat(last.workouts) });
      if (ok2) { closeSheet(); S.tab = 'plan'; toast('Plan enregistré'); schedule(); } else { btn.disabled = false; btn.textContent = 'Enregistrer ce plan'; }
    };
  });
}

function stepsHtml(w) {

function parseTrack(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) return null;
  const child = (el, n) => el && [...el.children].find(c => c.localName === n);
  const gain = eles => { let g = 0, ref = null; for (const e of eles) { if (!isFinite(e)) continue; if (ref === null || e < ref) ref = e; else if (e - ref >= 2) { g += e - ref; ref = e; } } return Math.round(g); };
  const pts = [...doc.getElementsByTagNameNS('*', 'trkpt')];
  if (pts.length > 1) {
    const R = 6371000, rad = x => x * Math.PI / 180;
    let d = 0, hrs = [], eles = [], prev = null;
    for (const p of pts) {
      const lat = +p.getAttribute('lat'), lon = +p.getAttribute('lon');
      if (prev) { const dl = rad(lat - prev[0]), dn = rad(lon - prev[1]); const a = Math.sin(dl / 2) ** 2 + Math.cos(rad(prev[0])) * Math.cos(rad(lat)) * Math.sin(dn / 2) ** 2; d += 2 * R * Math.asin(Math.sqrt(a)); }
      prev = [lat, lon];
      eles.push(Number(child(p, 'ele')?.textContent));
      const hr = p.getElementsByTagNameNS('*', 'hr')[0]; if (hr) hrs.push(Number(hr.textContent));
    }
    const t0 = new Date(child(pts[0], 'time')?.textContent), t1 = new Date(child(pts[pts.length - 1], 'time')?.textContent);
    return { date: isNaN(t0) ? null : F.iso(t0), dist: d / 1000, dur: isNaN(t0) || isNaN(t1) ? null : (t1 - t0) / 1000, hr: hrs.length ? Math.round(hrs.reduce((a, b) => a + b, 0) / hrs.length) : null, dplus: gain(eles) };
  }
  const laps = [...doc.getElementsByTagNameNS('*', 'Lap')];
  if (laps.length) {
    let dur = 0, dist = 0, hrw = 0;
    laps.forEach(l => { const t = Number(child(l, 'TotalTimeSeconds')?.textContent) || 0; dur += t; dist += Number(child(l, 'DistanceMeters')?.textContent) || 0; const h = Number(child(child(l, 'AverageHeartRateBpm'), 'Value')?.textContent); if (h) hrw += h * t; });
    const eles = [...doc.getElementsByTagNameNS('*', 'AltitudeMeters')].map(e => Number(e.textContent));
    const st = new Date(laps[0].getAttribute('StartTime'));
    return { date: isNaN(st) ? null : F.iso(st), dist: dist / 1000, dur, hr: hrw && dur ? Math.round(hrw / dur) : null, dplus: gain(eles) };
  }
  return null;
}

/* ---------- Intervals.icu workout text ---------- */
function icuDur(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return `${h ? h + 'h' : ''}${m ? m + 'm' : ''}${x ? x + 's' : ''}` || '0s'; }
function icuDist(m) { return m >= 1000 ? `${+(m / 1000).toFixed(3)}km` : `${Math.round(m)}mtr`; }
function icuPace(z) { const p = Math.round(F.paceMid(z, ctx())); return `${Math.floor(p / 60)}:${F.pad(p % 60)}/km Pace`; }
const ICU_CUE = { wu: 'Echauffement', rec: 'Recup', cd: 'Retour au calme' };
function icuStep(st) {
  const cue = ICU_CUE[st.k] || F.ascii(F.zoneLabel(st.z, ctx().goal), 20);
  return `- ${cue} ${st.by === 'time' ? icuDur(st.v) : icuDist(st.v)} ${icuPace(st.z)}`;
}
function intervalsText(w) {
  const lines = [];
  w.steps.forEach(st => {
    if (st.k === 'rep' && st.n > 1) {
      if (lines.length && lines[lines.length - 1] !== '') lines.push('');
      lines.push(`${st.n}x`); st.steps.forEach(x => lines.push(icuStep(x))); lines.push('');
    } else if (st.k === 'rep') st.steps.forEach(x => lines.push(icuStep(x)));
    else lines.push(icuStep(st));
  });
  while (lines[lines.length - 1] === '') lines.pop();
  return lines.join('\n');
}
function sheetIntervals(w) {
  const text = intervalsText(w), title = F.notation(w, ctx());
  openSheet('Intervals.icu', `
    <p class="eyebrow">${esc(relDay(w.date))}</p>
    <label class="field"><span>Nom de la séance</span><input id="icu-title" readonly value="${esc(title)}"></label>
    <label class="field"><span>Description (étapes et allures)</span><textarea id="icu-text" readonly rows="${Math.min(12, text.split('\n').length + 1)}" style="font:500 14px/1.45 ui-monospace,Menlo,monospace">${esc(text)}</textarea></label>
    <div class="grid2"><button class="btn" id="icu-ct">Copier le nom</button><button class="btn primary" id="icu-cx">Copier la description</button></div>
    <ol class="ol">
      <li>Dans Intervals.icu, ouvre le calendrier au <b>${esc(fmtDay(w.date, { weekday: 'long', day: 'numeric', month: 'long' }))}</b> et ajoute une séance planifiée de type <b>Run</b>.</li>
      <li>Colle le nom, puis la description dans la zone de texte de la séance : les étapes se construisent toutes seules. Enregistre.</li>
      <li>Intervals.icu l’envoie dans ton calendrier Garmin Connect, et l’appli Connect la transfère à la montre à la prochaine synchronisation.</li>
    </ol>
    <a class="btn block" href="https://intervals.icu/" target="_blank" rel="noopener">Ouvrir Intervals.icu</a>
    <details><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:600">Première fois : relier Garmin</summary>
      <p class="small muted" style="margin-top:8px">Crée un compte gratuit sur Intervals.icu, puis dans Réglages › Garmin Connect, connecte ton compte Garmin et autorise l’envoi des séances planifiées (« Upload planned workouts »). Intervals.icu envoie les séances des 7 prochains jours.</p></details>
    <p class="small muted">Chaque étape porte l’allure au milieu de ta plage cible. Certains utilisateurs signalent que, dans les répétitions, Garmin affiche parfois l’allure en simple note : vérifie la première séance sur la montre.</p>`, el => {
    const copy = async (id, val) => {
      try { await navigator.clipboard.writeText(val); toast('Copié'); }
      catch (e) { const t = $(id, el); t.focus(); t.select(); toast('Sélectionné : utilise Copier'); }
    };
    $('#icu-ct', el).onclick = () => copy('#icu-title', title);
    $('#icu-cx', el).onclick = () => copy('#icu-text', text);
  });
}

/* ---------- Garmin export ---------- */
async function saveFiles(files) {
  // files: [{name, data: Uint8Array|string, type}]
  const asFile = f => new File([f.data], f.name, { type: f.type || 'application/octet-stream' });
  const list = files.map(asFile);
  if (navigator.canShare && navigator.share) {
    try { if (navigator.canShare({ files: list })) { await navigator.share({ files: list }); return 'shared'; } }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  let blob, name;
  if (files.length === 1) { blob = list[0]; name = files[0].name; }
  else { blob = new Blob([F.zip(files.map(f => ({ name: f.name, data: f.data })))], { type: 'application/zip' }); name = 'foulee-seances.zip'; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return 'downloaded';
}
async function exportGarmin(list, label) {
  if (!list.length) { toast('Aucune séance à exporter.'); return; }
  const c = ctx();
  const files = list.map(w => {
    const d = F.parseD(w.date);
    const title = `${F.pad(d.getDate())}/${F.pad(d.getMonth() + 1)} ${F.notation(w, c)}`;
    return { name: `${w.date}_${F.ascii(TYPES[w.type]?.short || 'seance', 20).replace(/\s+/g, '-')}.fit`, data: F.encodeFit(w, c, title), type: 'application/octet-stream' };
  });
  const res = await saveFiles(files);
  if (res !== 'cancelled') sheetExportHelp(list.length);
}
function sheetExportHelp(n) {
  openSheet('Envoyer sur la Venu 2S', `
    <p>${n > 1 ? `${n} séances exportées, une par fichier .fit.` : 'Séance exportée au format .fit.'} Garmin Connect n'accepte pas l'import de séances : le transfert direct vers la montre passe par le câble USB.</p>
    <ol class="ol">
      <li>Dans le menu de partage, choisis « Enregistrer dans Fichiers » (iCloud Drive) ou AirDrop vers ton Mac.</li>
      <li>Branche la montre en USB. Sur Mac, ouvre-la avec OpenMTP ou Android File Transfer ; sur Windows elle apparaît dans l’Explorateur.</li>
      <li>Copie les fichiers .fit dans le dossier <b>GARMIN/NewFiles</b>.</li>
      <li>Débranche : la montre importe les séances. Sur la montre, lance l’activité Course, ouvre le menu et choisis Entraînements.</li>
    </ol>
    <p class="note info">Sans ordinateur : dans l’app Garmin Connect, Entraînement et planification › Entraînements › Créer, puis recopie les étapes et allures affichées dans la séance.</p>
    <button class="btn primary block" data-close2>Compris</button>`, el => { $('[data-close2]', el).onclick = closeSheet; });
}

function sheetSettings() {
  const counts = `${(S.plan?.workouts || []).length} séances · ${S.runs.length} sorties · ${S.routes.length} parcours`;
  openSheet('Sauvegarde', `
    <p>Tes données sont enregistrées uniquement sur ce téléphone. Sauvegarde-les de temps en temps dans Fichiers (iCloud Drive) : c'est ce qui te permet de les retrouver si tu changes de téléphone.</p>
    <div class="card col" style="gap:6px"><b class="num">${counts}</b><span class="small muted">Dernière sauvegarde : ${S.lastBackup ? esc(fmtDay(S.lastBackup, { day: 'numeric', month: 'long', year: 'numeric' })) : 'jamais'}</span></div>
    <button class="btn primary block" id="bk-save">Sauvegarder mes données</button>
    <label class="btn block" style="cursor:pointer">Restaurer une sauvegarde<input id="bk-file" type="file" accept=".json,application/json" hidden></label>
    <div id="bk-confirm" hidden class="card col" style="gap:10px"><p id="bk-info"></p><button class="btn danger block" id="bk-go">Remplacer mes données par cette sauvegarde</button></div>
    <p class="small muted">Foulée · version 1</p>`, el => {
    $('#bk-save', el).onclick = async () => {
      const day = TODAY;
      const prev = S.lastBackup; S.lastBackup = day;
      const res = await saveFiles([{ name: `foulee-sauvegarde-${day}.json`, data: JSON.stringify(Store.dump(), null, 1), type: 'application/json' }]);
      if (res === 'cancelled') { S.lastBackup = prev; return; }
      Store.saveLocal(); toast('Sauvegarde créée'); sheetSettings();
    };
    $('#bk-file', el).onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const fr = new FileReader();
      fr.onload = () => {
        let d; try { d = JSON.parse(String(fr.result)); } catch (x) { d = null; }
        if (!d || d.app !== 'foulee') { toast("Ce fichier n'est pas une sauvegarde Foulée."); return; }
        $('#bk-info', el).textContent = `Sauvegarde du ${d.savedAt ? fmtDay(F.iso(new Date(d.savedAt)), { day: 'numeric', month: 'long', year: 'numeric' }) : '?'} : ${(d.plan?.workouts || []).length} séances, ${(d.runs || []).length} sorties, ${(d.routes || []).length} parcours. Tes données actuelles seront remplacées.`;
        $('#bk-confirm', el).hidden = false;
        $('#bk-go', el).onclick = () => { Store.apply(d); if (Store.saveLocal()) { closeSheet(); toast('Données restaurées'); } };
      };
      fr.readAsText(file);
    };
  });
}
$('#settings').onclick = sheetSettings;

render();
Store.init();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
